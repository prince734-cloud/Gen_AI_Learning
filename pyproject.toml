[project]
name = "genai2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prince yadav", email = "py8390457@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "beautifulsoup4>=4.13.4",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[project.scripts]
genai2 = "genai2:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
